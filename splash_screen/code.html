            0% { transform: translateY(-100%); opacity: 0; }

            animation: data-stream 8s linear infinite;

        }
        .loading-bar-progress {

        }
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>

<div class="absolute top-0 left-1/2 w-[1px] h-96 bg-gradient-to-b from-transparent via-secondary-fixed to-transparent animate-data-stream" style="animation-delay: 2s;"></div>

<div class="relative group">
<div class="absolute -inset-4 bg-secondary-fixed/20 rounded-full blur-2xl group-hover:bg-secondary-fixed/40 transition-all duration-700"></div>
<div class="relative w-24 h-24 md:w-32 md:h-32 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full flex items-center justify-center shadow-2xl glow-pulse">

                        shield_with_heart

</div>
</div>

</div>
<!-- AI Monitoring Indicator / Status -->
<div class="flex items-center gap-2 px-4 py-2 bg-white/5 backdrop-blur-md rounded-full border border-white/5">

</div>
</div>

<div class="h-[2px] w-full bg-white/10 rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-secondary-fixed-dim to-secondary-fixed loading-bar-progress shadow-[0_0_10px_rgba(0,253,238,0.5)]"></div>
</div>
<div class="flex justify-between mt-3 font-label-sm text-on-surface-variant/40">

<span id="progress-percent">0%</span>
</div>
</div>
</main>
<!-- Footer Identity (Optional/Subtle) -->

<span class="font-label-sm text-on-surface-variant/20 tracking-[0.2em] uppercase">
            Powered by SafeRoute Intelligence
        </span>
</footer>
<script>
        // Micro-interaction: Progress percentage counter
        const progressEl = document.getElementById('progress-percent');
        let count = 0;
        const target = 100;
        const duration = 2400; // Match the CSS animation duration slightly less
        const interval = duration / target;

        const updateCounter = () => {
            if (count < target) {
                count++;
                progressEl.textContent = count + '%';
                setTimeout(updateCounter, interval);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(updateCounter, 100);
        });

        // Subtle parallax mouse movement effect
        document.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            const x = (clientX / window.innerWidth - 0.5) * 20;
            const y = (clientY / window.innerHeight - 0.5) * 20;
            const main = document.querySelector('main');
            if (main) {
                main.style.transform = `translate(${x}px, ${y}px)`;
            }
        });
    </script>
