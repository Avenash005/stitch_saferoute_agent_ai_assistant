<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">

<div class="fixed inset-0 z-0 bg-map-pattern opacity-40 scale-105" data-alt="A highly detailed, cinematic aerial view of an urban city map at night, featuring glowing neon blue and cyan arterial routes. The streets are blurred with a sophisticated bokeh effect, creating a sense of depth and advanced predictive technology. The overall lighting is moody and dark, punctuated by sharp, high-tech grid lines that suggest an AI surveillance or navigation system. The aesthetic is ultra-modern, leaning into dark mode minimalism with a premium, glass-like finish."></div>
<!-- Top Navigation / Toggle -->
<nav class="relative z-10 flex justify-between items-center px-container-margin h-16 fixed top-0 w-full bg-background/80 backdrop-blur-xl border-b border-white/10">
<div class="flex items-center gap-2">
<span class="font-display-lg text-headline-md-mobile md:text-headline-md text-secondary-fixed tracking-tight">SafeRoute</span>
<span class="bg-secondary-fixed/10 text-secondary-fixed text-[10px] px-2 py-0.5 rounded-full border border-secondary-fixed/20 font-bold uppercase tracking-widest">Agent</span>
</div>
<!-- Language Toggle -->
<div class="flex bg-surface-container-highest/50 p-1 rounded-full border border-white/10">
<button class="px-4 py-1.5 rounded-full text-label-md font-label-md transition-all duration-300 bg-secondary-fixed text-on-secondary-fixed" id="lang-en">English</button>

</div>

<!-- Main Content -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-container-margin pt-20 pb-12">
<div class="w-full max-w-md space-y-stack-lg">
<!-- Header Text -->
<div class="text-center space-y-2">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-white">Welcome Back</h1>
<p class="text-on-surface-variant font-body-md">Secure access to the monitoring dashboard</p>
</div>
<!-- Login Card -->
<div class="glass-panel p-stack-lg rounded-2xl space-y-stack-md">
<!-- Email/Phone Input -->
<div class="space-y-stack-sm">
<label class="block text-label-sm font-label-sm text-on-surface-variant ml-1">Email or Phone</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-secondary-fixed">person</span>
<input class="w-full bg-white/5 border border-white/10 rounded-xl py-4 pl-12 pr-4 text-white placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-secondary-fixed focus:border-secondary-fixed transition-all" placeholder="agent@saferoute.ai" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-stack-sm">
<div class="flex justify-between items-center ml-1">
<label class="text-label-sm font-label-sm text-on-surface-variant">Password</label>
<a class="text-label-sm font-label-sm text-secondary-fixed hover:underline" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-secondary-fixed">lock</span>
<input class="w-full bg-white/5 border border-white/10 rounded-xl py-4 pl-12 pr-12 text-white placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-secondary-fixed focus:border-secondary-fixed transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-white">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-secondary-fixed text-on-secondary-fixed font-headline-md text-headline-md py-4 rounded-xl cyan-glow active:scale-[0.98] transition-all duration-200">
                    Get Started
                </button>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-white/10"></div>
<span class="text-label-sm font-label-sm text-outline">OR CONTINUE WITH</span>
<div class="h-[1px] flex-1 bg-white/10"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-3 gap-stack-md">
<button class="flex items-center justify-center p-3 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all active:scale-95">

<path d="M5.277 14.268A7.12 7.12 0 0 1 4.909 12c0-.791.137-1.55.377-2.268L1.26 6.615A11.978 11.978 0 0 0 0 12c0 1.921.453 3.737 1.241 5.35l4.036-3.082z" fill="#FBBC05"></path>
</svg>
</button>
<button class="flex items-center justify-center p-3 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all active:scale-95">

<path d="M17.05 20.28c-.96.95-2.06 1.83-3.23 2.06-1.29.25-2.27-.2-3.52-.2-1.25 0-2.38.48-3.53.21-1.17-.26-2.24-1.11-3.19-2.07-2.01-2.03-3.06-5.58-2.06-8.35.49-1.37 1.54-2.26 2.76-2.31 1.15-.05 1.94.59 2.8.59.84 0 1.87-.73 3.2-.62 1.37.1 2.37.66 2.97 1.45-2.5 1.35-2.1 4.88.5 5.92-.58 1.48-1.28 2.87-2.3 3.32zM12.03 5.4c-.05-2.24 1.76-4.14 3.97-4.4.24 2.45-2.14 4.56-3.97 4.4z"></path>

</button>

</div>
<!-- Registration Link -->
<p class="text-center text-on-surface-variant text-label-md font-label-md">
                Don't have an agent account? <a class="text-secondary-fixed hover:underline" href="#">Apply here</a>
</p>

</main>
<!-- Footer Stats (Subtle) -->
<footer class="relative z-10 p-container-margin grid grid-cols-3 gap-4 max-w-lg mx-auto mb-4">
<div class="text-center">
<div class="text-secondary-fixed font-bold text-label-md">1.2M+</div>
<div class="text-[10px] text-on-surface-variant uppercase tracking-wider">Active Routes</div>
</div>
<div class="text-center border-x border-white/10">
<div class="text-secondary-fixed font-bold text-label-md">99.9%</div>
<div class="text-[10px] text-on-surface-variant uppercase tracking-wider">Uptime</div>
</div>
<div class="text-center">
<div class="text-secondary-fixed font-bold text-label-md">&lt; 2s</div>
<div class="text-[10px] text-on-surface-variant uppercase tracking-wider">Response</div>
</div>
</footer>
<script>
        const btnEn = document.getElementById('lang-en');
        const btnTa = document.getElementById('lang-ta');

        function setLanguage(lang) {
            if (lang === 'en') {
                btnEn.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed');
                btnEn.classList.remove('text-on-surface-variant');
                btnTa.classList.remove('bg-secondary-fixed', 'text-on-secondary-fixed');
                btnTa.classList.add('text-on-surface-variant');
            } else {
                btnTa.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed');
                btnTa.classList.remove('text-on-surface-variant');
                btnEn.classList.remove('bg-secondary-fixed', 'text-on-secondary-fixed');
                btnEn.classList.add('text-on-surface-variant');
            }
        }

        btnEn.addEventListener('click', () => setLanguage('en'));
        btnTa.addEventListener('click', () => setLanguage('ta'));

        // Input visual feedback
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
