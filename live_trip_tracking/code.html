<script>
        // Micro-interactions for dynamic notifications
        const notifications = [
            "Heavy traffic detected 500m ahead.",
            "Route optimized: Saved 2 mins.",
            "AI Guard: Environment scan clear.",
            "Approaching safe zone in 1km."
        ];
        let currentNotif = 0;
        const notifElement = document.getElementById('dynamic-notif');
        const notifText = notifElement.querySelector('p');

        setInterval(() => {
            notifElement.style.opacity = '0';
            notifElement.style.transform = 'translateY(-10px)';
            
            setTimeout(() => {
                currentNotif = (currentNotif + 1) % notifications.length;
                notifText.innerText = notifications[currentNotif];
                notifElement.style.opacity = '1';
                notifElement.style.transform = 'translateY(0)';
            }, 500);
        }, 8000);

        // Simulated pulse and movement for the map marker
        let posX = 0;
        let posY = 0;
        function animateMarker() {
            posX = Math.sin(Date.now() / 2000) * 5;
            posY = Math.cos(Date.now() / 2500) * 5;
            const marker = document.querySelector('.relative.flex.items-center.justify-center');
            if(marker) {
                marker.style.transform = `translate(${posX}px, ${posY}px)`;
            }
            requestAnimationFrame(animateMarker);
        }
        animateMarker();
    </script>
